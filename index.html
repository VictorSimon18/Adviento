<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendario de Adviento</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="nieve" aria-hidden="true"></div>

  <main id="principal">
    <h1>Calendario de Adviento</h1>
    <div class="tablero">
      <div id="grid" class="grid"></div>
    </div>
  </main>

  <!-- PROVISIONAL: borrar este botón (y su código en app.js / style.css) antes de publicar -->
  <button type="button" id="reiniciar" class="reiniciar">Reiniciar calendario</button>

  <!-- Aviso breve (celdas bloqueadas) -->
  <div id="aviso" class="aviso" role="status" aria-live="polite"></div>

  <!-- Modal: el contenido lo rellena renderContenido(dia) en app.js -->
  <div id="modal" class="modal" hidden>
    <div id="modal-caja" class="modal-caja" role="dialog" aria-modal="true" aria-labelledby="modal-titulo" tabindex="-1">
      <button type="button" id="modal-cerrar" class="modal-cerrar" aria-label="Cerrar">&times;</button>
      <div id="modal-contenido"></div>
    </div>
  </div>

  <!-- Scripts normales (sin módulos): data.js antes que app.js -->
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
